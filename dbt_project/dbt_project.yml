name: 'customer360_attribution'
version: '1.0.0'
config-version: 2

# Profile defined in profiles.yml
profile: 'customer360_bigquery'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  customer360_attribution:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      customer_360:
        +materialized: table
        +schema: customer_360
      marketing_attribution:
        +materialized: table
        +schema: marketing_attribution
